buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        maven { url "https://maven.aliyun.com/repository/public" }
        google()
        mavenCentral()
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/google" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        maven { url "https://maven.aliyun.com/repository/public" }
        google()
        mavenCentral()
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/google" }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            if (p.android.namespace == null) {
                def manifestFile = p.file("${p.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def parsedManifest = new groovy.xml.XmlParser().parse(manifestFile)
                    def packageName = parsedManifest.@package
                    if (packageName) {
                        p.android.namespace = packageName
                    }
                }
            }
        }
    }
}

subprojects {
    if (project.name != 'app') {
        project.evaluationDependsOn(':app')
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
